<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capas com IA · Casa Mar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #f4f2ee;
    --painel: #ffffff;
    --texto: #1f2a2e;
    --suave: #6b7478;
    --linha: #e3dfd8;
    --marca: #1f3c45;
    --marca-texto: #ffffff;
    --destaque: #c9473b;
    --ok: #2f7d4f;
    --ok-fundo: #e5f2ea;
    --aviso: #9a6a12;
    --aviso-fundo: #fbf0d9;
    --erro: #b3362b;
    --erro-fundo: #fbe6e3;
    --neutro-fundo: #efece6;
    --log-fundo: #172024;
    --log-texto: #d8e2e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #121719;
      --painel: #1b2225;
      --texto: #e9ecec;
      --suave: #9aa5a8;
      --linha: #2c3539;
      --marca: #7fb2c0;
      --marca-texto: #0f1416;
      --ok: #7fcf9c;
      --ok-fundo: #1d3326;
      --aviso: #e7bf6a;
      --aviso-fundo: #372d17;
      --erro: #f0897e;
      --erro-fundo: #3a1f1c;
      --neutro-fundo: #252d30;
      --log-fundo: #0c1012;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.5 Montserrat, system-ui, sans-serif;
  }
  .topo { padding: 28px 16px 8px; max-width: 980px; margin: 0 auto; }
  .topo h1 { font: 600 2.1rem/1.1 "Cormorant Garamond", serif; margin: 0; }
  .topo p { margin: 4px 0 0; color: var(--suave); font-size: .9rem; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 48px; }

  form.busca { display: flex; gap: 8px; margin: 16px 0 20px; }
  form.busca input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.1rem; padding: 12px 14px;
    border: 1px solid var(--linha); border-radius: 10px; background: var(--painel); color: var(--texto);
  }
  form.busca input:focus { outline: 2px solid var(--marca); outline-offset: 1px; }

  button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 11px 18px; cursor: pointer;
    border: 1px solid var(--marca); background: var(--marca); color: var(--marca-texto);
  }
  button.sec { background: transparent; color: var(--marca); }
  button.link { background: none; border: none; color: var(--suave); padding: 6px 0; font-weight: 500; text-decoration: underline; }
  button:disabled { opacity: .45; cursor: default; }

  .cartao { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; padding: 20px; }
  .cabeca { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
  .cabeca h2 { margin: 0; font: 600 1.7rem/1 "Cormorant Garamond", serif; }
  .cabeca a { color: var(--marca); font-size: .9rem; }

  .selos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .selo { border-radius: 999px; padding: 4px 12px; font-size: .82rem; font-weight: 500; background: var(--neutro-fundo); color: var(--suave); }
  .selo.ok { background: var(--ok-fundo); color: var(--ok); }
  .selo.aviso { background: var(--aviso-fundo); color: var(--aviso); }
  .selo.erro { background: var(--erro-fundo); color: var(--erro); }

  /* no máximo o tamanho real do card no desktop (352x450) */
  .fotos { display: grid; grid-template-columns: repeat(2, minmax(0, 352px)); gap: 20px; }
  .foto figcaption { font-size: .82rem; color: var(--suave); margin-bottom: 6px; font-weight: 500; }
  .moldura {
    position: relative; aspect-ratio: 352 / 450; border-radius: 10px; overflow: hidden;
    background: var(--neutro-fundo); display: grid; place-items: center; color: var(--suave); font-size: .9rem; text-align: center; padding: 0;
  }
  .moldura img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .moldura .vazio { padding: 16px; }
  /* imita o card do site: gradiente escuro embaixo onde vai o texto */
  .moldura.card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.1) 50%, rgba(0,0,0,.85) 95%);
  }
  .moldura .cod {
    position: absolute; top: 12px; left: 12px; z-index: 1; background: #fff; color: #1f3c45;
    font-size: .7rem; border-radius: 5px; padding: 3px 6px;
  }
  .moldura .faixa {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 1; color: #fff;
    font: 600 1.35rem/1.1 "Cormorant Garamond", serif;
  }
  .moldura .faixa small { display: block; font: 400 .72rem Montserrat, sans-serif; opacity: .85; margin-top: 4px; }

  .acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
  .acoes .dica { color: var(--suave); font-size: .85rem; flex-basis: 100%; }

  .tarefa { margin-top: 18px; border-top: 1px solid var(--linha); padding-top: 14px; }
  .tarefa .estado { font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .girando { width: 14px; height: 14px; border: 2px solid var(--linha); border-top-color: var(--marca); border-radius: 50%; animation: gira 0.8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  pre.log {
    margin: 0; max-height: 240px; overflow: auto; background: var(--log-fundo); color: var(--log-texto);
    border-radius: 10px; padding: 12px 14px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }

  .msg { padding: 14px 16px; border-radius: 10px; background: var(--erro-fundo); color: var(--erro); margin-bottom: 16px; }
  h3.secao { font: 600 1.3rem "Cormorant Garamond", serif; margin: 34px 0 12px; }
  .recentes { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
  .recentes button {
    padding: 0; border: 1px solid var(--linha); background: var(--painel); color: var(--texto);
    border-radius: 10px; overflow: hidden; text-align: left; font-weight: 500;
  }
  .recentes img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .recentes span { display: block; padding: 6px 8px; font-size: .78rem; }
  .recentes span i { font-style: normal; color: var(--ok); }

  .arquivo .botao-sec {
    display: inline-block; font-weight: 600; border-radius: 10px; padding: 11px 18px; cursor: pointer;
    border: 1px solid var(--marca); color: var(--marca);
  }
  code { font: .85em ui-monospace, Consolas, monospace; background: var(--neutro-fundo); padding: 1px 5px; border-radius: 4px; }

  @media (max-width: 560px) {
    .fotos { gap: 10px; }
    .cartao { padding: 14px; }
    .moldura .faixa { font-size: 1.05rem; }
    .acoes button:not(.link) { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header class="topo">
  <h1>Capas com IA</h1>
  <p>Foto de capa do card de destaque · casamarimoveis.net</p>
</header>
<main>
  <form class="busca" id="busca">
    <input id="codigo" inputmode="numeric" autocomplete="off" placeholder="Código do imóvel (ex.: 16504)" aria-label="Código do imóvel">
    <button type="submit">Buscar</button>
  </form>
  <div id="erro"></div>
  <div id="resultado"></div>
  <h3 class="secao">Geradas recentemente</h3>
  <div class="recentes" id="recentes"></div>

  <h3 class="secao">Login do ChatGPT</h3>
  <div class="cartao sessao">
    <p id="sessaoInfo" style="margin:0 0 12px;color:var(--suave)">…</p>
    <label class="arquivo">
      <input type="file" id="sessaoArq" accept=".json,application/json" hidden>
      <span class="botao-sec">Enviar sessao-chatgpt.json</span>
    </label>
    <p style="margin:12px 0 0;color:var(--suave);font-size:.85rem">
      Se a IA parar com “Não está logado no ChatGPT”: no Windows rode
      <code>node melhorar.js --exportar-sessao</code> e envie o arquivo gerado aqui.
    </p>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let atual = null, timer = null;

const quando = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(caminho, opcoes) {
  const r = await fetch(caminho, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || `Erro ${r.status}`);
  return j;
}

function mostrarErro(texto) { $('#erro').innerHTML = texto ? `<div class="msg">${esc(texto)}</div>` : ''; }

async function buscar(codigo, { silencioso = false } = {}) {
  codigo = String(codigo).trim();
  if (!/^\d{1,9}$/.test(codigo)) return mostrarErro('Digite só o número do código.');
  if (!silencioso) { mostrarErro(''); $('#resultado').innerHTML = '<div class="cartao">Consultando o imóvel…</div>'; }
  try {
    atual = await api(`/api/imovel/${codigo}`);
    history.replaceState(null, '', `#${codigo}`);
    desenhar();
  } catch (e) {
    mostrarErro(e.message);
    if (!silencioso) $('#resultado').innerHTML = '';
  }
}

async function acao(nome) {
  if (!atual) return;
  if (nome === 'publicar' && !confirm(`Publicar a foto da IA como capa do imóvel ${atual.codigo} no Jetimob e no site?`)) return;
  if (nome === 'gerar' && atual.publicado && !atual.novaNaoPublicada && !confirm('Este imóvel já está publicado. Gerar uma foto nova? (a publicada continua no site até você publicar a nova)')) return;
  try {
    mostrarErro('');
    atual = await api(`/api/imovel/${atual.codigo}/${nome}`, { method: 'POST' });
    desenhar();
  } catch (e) { mostrarErro(e.message); }
}

function selos(s) {
  const l = [];
  if (!s.noSite) l.push(['erro', 'Não encontrado no site']);
  if (!s.ia) l.push(['', 'Sem foto de IA']);
  else if (s.ia.status === 'ok') l.push(['ok', `IA gerada ${quando(s.ia.data)}`]);
  else l.push(['erro', `IA falhou (${s.ia.tentativas}x)`]);
  if (s.publicado) {
    l.push(['ok', `Publicada ${quando(s.publicado.data)}`]);
    l.push(s.publicado.site ? ['ok', 'No site'] : ['aviso', 'Site ainda não atualizou']);
  } else if (s.ia?.status === 'ok') l.push(['aviso', 'Não publicada']);
  if (s.novaNaoPublicada) l.push(['aviso', 'Foto nova ainda não publicada']);
  if (s.rejeitado) l.push(['erro', 'Fora da publicação automática']);
  if (s.rodadaIA) l.push(['', 'Rodada automática da IA ativa']);
  return l.map(([c, t]) => `<span class="selo ${c}">${esc(t)}</span>`).join('');
}

function desenhar() {
  const s = atual;
  const rodando = s.tarefa && !s.tarefa.fim;
  const temCard = !!s.card && s.ia?.status === 'ok';
  const podePublicar = temCard && (!s.publicado || s.novaNaoPublicada);

  let botoes = '';
  if (!temCard) botoes += `<button data-acao="gerar" ${rodando || !s.noSite ? 'disabled' : ''}>Gerar com IA</button>`;
  if (podePublicar) botoes += `<button data-acao="publicar" ${rodando ? 'disabled' : ''}>${s.publicado ? 'Publicar a nova' : 'Publicar no site'}</button>`;
  if (temCard) botoes += `<button class="sec" data-acao="gerar" ${rodando || !s.noSite ? 'disabled' : ''}>Gerar de novo</button>`;
  botoes += `<button class="link" data-acao="rejeitar">${s.rejeitado ? 'Voltar para a publicação automática' : 'Não publicar automaticamente'}</button>`;

  const dica = !temCard ? 'A IA deixa a foto vertical sem cortar a casa, tira a marca d’água e melhora céu, luz e cores. Leva cerca de 1 minuto.'
    : podePublicar ? 'Publicar sobe a foto como capa no Jetimob (a original fica em 2º) e atualiza o site na hora.'
    : 'Esta é a foto que está no site. “Gerar de novo” cria outra versão; a atual só sai quando você publicar a nova.';

  let tarefa = '';
  if (s.tarefa) {
    const t = s.tarefa;
    const nome = t.tipo === 'gerar' ? 'Gerando com IA' : 'Publicando';
    const est = !t.fim ? `<span class="girando"></span> ${nome}… ${t.naFila ? '(na fila da rodada automática)' : ''}`
      : t.ok ? `✓ ${t.tipo === 'gerar' ? 'Foto gerada' : 'Publicado'} ${quando(t.fim)}` : `✗ ${nome} falhou`;
    tarefa = `<div class="tarefa"><div class="estado">${est}</div><pre class="log" id="log">${esc(t.log.join('\n')) || '…'}</pre></div>`;
  }

  const imgOriginal = s.original ? `<img src="${esc(s.original)}" alt="Foto original" loading="lazy">` : '<span class="vazio">Sem foto original</span>';
  const imgIA = s.card
    ? `<img src="${esc(s.card)}" alt="Foto gerada pela IA"><span class="cod">Cód ${esc(s.codigo)}</span><span class="faixa">Prévia do card<small>como aparece no site</small></span>`
    : `<span class="vazio">${rodando && s.tarefa.tipo === 'gerar' ? 'Gerando…' : 'Ainda não gerada'}</span>`;

  $('#resultado').innerHTML = `
    <section class="cartao">
      <div class="cabeca">
        <h2>Imóvel ${esc(s.codigo)}</h2>
        ${s.urlSite ? `<a href="${esc(s.urlSite)}" target="_blank" rel="noopener">ver no site ↗</a>` : ''}
      </div>
      <div class="selos">${selos(s)}</div>
      <div class="fotos">
        <figure class="foto" style="margin:0"><figcaption>Original (corte do card)</figcaption><div class="moldura">${imgOriginal}</div></figure>
        <figure class="foto" style="margin:0"><figcaption>Com IA</figcaption><div class="moldura ${s.card ? 'card' : ''}">${imgIA}</div></figure>
      </div>
      ${s.ia?.status === 'erro' ? `<div class="msg" style="margin-top:16px">Último erro da IA: ${esc(s.ia.erro)}</div>` : ''}
      <div class="acoes">${botoes}<span class="dica">${dica}</span></div>
      ${tarefa}
    </section>`;
  document.querySelectorAll('[data-acao]').forEach(b => b.onclick = () => acao(b.dataset.acao));
  const log = $('#log'); if (log) log.scrollTop = log.scrollHeight;

  clearTimeout(timer);
  if (rodando) timer = setTimeout(() => buscar(s.codigo, { silencioso: true }), 3000);
  else if (s.tarefa?.fim) carregarRecentes();
}

async function carregarRecentes() {
  try {
    const l = await api('/api/recentes');
    $('#recentes').innerHTML = l.length ? l.map(r => `
      <button data-cod="${esc(r.codigo)}"><img src="${esc(r.card)}" alt="" loading="lazy">
      <span>${esc(r.codigo)} ${r.publicado ? '<i>· no site</i>' : ''}</span></button>`).join('')
      : '<p style="color:var(--suave)">Nenhuma ainda.</p>';
    document.querySelectorAll('[data-cod]').forEach(b => b.onclick = () => { $('#codigo').value = b.dataset.cod; buscar(b.dataset.cod); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  } catch {}
}

async function carregarSessao() {
  try {
    const s = await api('/api/sessao');
    const d = (ms) => ms ? quando(new Date(ms).toISOString()) : 'nunca';
    $('#sessaoInfo').textContent = !s.enviada ? 'Nenhuma sessão enviada por aqui ainda.'
      : s.pendente ? `Sessão enviada ${d(s.enviada)} — será importada antes da próxima rodada da IA.`
      : `Sessão enviada ${d(s.enviada)}, importada ${d(s.importada)}.`;
  } catch {}
}
$('#sessaoArq').onchange = async (e) => {
  const arq = e.target.files[0];
  if (!arq) return;
  try {
    const r = await api('/api/sessao', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: await arq.text() });
    alert(r.mensagem);
  } catch (err) { alert(err.message); }
  e.target.value = '';
  carregarSessao();
};
carregarSessao();

$('#busca').onsubmit = (e) => { e.preventDefault(); buscar($('#codigo').value); };
window.onhashchange = () => {
  const c = location.hash.slice(1);
  if (c && c !== atual?.codigo) { $('#codigo').value = c; buscar(c); }
};
carregarRecentes();
if (location.hash.slice(1)) { $('#codigo').value = location.hash.slice(1); buscar(location.hash.slice(1)); }
</script>
</body>
</html>
